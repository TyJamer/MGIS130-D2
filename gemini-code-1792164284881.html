<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Affirmations & Mindfulness</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Dynamic Background Image Container -->
    <div id="bg-overlay" class="bg-overlay"></div>

    <div class="app-container">
        
        <!-- Header & Time-of-Day Mood Check-in -->
        <header class="app-header">
            <h1 id="greeting-title">Good Day</h1>
            <p id="time-subtext" class="subtext">How are you feeling right now?</p>
            
            <div class="checkin-badge" id="checkin-badge">
                <span id="checkin-time-text">Time for your daily check-in</span>
            </div>
        </header>

        <!-- Navigation / Mode Tabs -->
        <nav class="nav-tabs">
            <button class="tab-btn active" id="tab-affirmations" onclick="switchView('affirmations')">Affirmations</button>
            <button class="tab-btn" id="tab-favorites" onclick="switchView('favorites')">Favorites (<span id="fav-count">0</span>)</button>
            <button class="tab-btn" id="tab-create" onclick="switchView('create')">Create Custom</button>
        </nav>

        <!-- MAIN VIEW 1: Affirmations & Mood Selector -->
        <section id="view-affirmations" class="view-section active">
            <!-- Mood Buttons -->
            <div class="mood-selector" id="mood-selector">
                <button class="mood-btn" data-mood="anxious" onclick="selectMood('anxious')">
                    <span class="mood-emoji">🌿</span> Anxious
                </button>
                <button class="mood-btn" data-mood="confident" onclick="selectMood('confident')">
                    <span class="mood-emoji">✨</span> Confident
                </button>
                <button class="mood-btn" data-mood="sad" onclick="selectMood('sad')">
                    <span class="mood-emoji">🌧️</span> Sad
                </button>
                <button class="mood-btn" data-mood="happy" onclick="selectMood('happy')">
                    <span class="mood-emoji">☀️</span> Happy
                </button>
                <button class="mood-btn" data-mood="self-love" onclick="selectMood('self-love')">
                    <span class="mood-emoji">💖</span> Self-Love
                </button>
            </div>

            <!-- Affirmation Card -->
            <div class="card-wrapper">
                <div class="affirmation-card" id="affirmation-card">
                    <div class="card-badge" id="card-mood-badge">Select a mood</div>
                    
                    <blockquote class="quote-text" id="quote-text">
                        "Choose a mood above to receive your personal affirmation for this moment."
                    </blockquote>
                    
                    <p class="quote-author" id="quote-author">— Mindfulness Companion</p>
                    <p class="cycle-info" id="cycle-info">Full non-repeating quote cycle active</p>

                    <!-- Card Actions -->
                    <div class="card-actions">
                        <button class="action-btn" id="fav-btn" onclick="toggleFavoriteCurrent()" title="Bookmark / Favorite" disabled>
                            <span class="icon" id="fav-icon">♡</span>
                            <span class="btn-label" id="fav-label">Favorite</span>
                        </button>

                        <button class="action-btn" id="next-btn" onclick="nextAffirmation()" title="Next Affirmation" disabled>
                            <span class="icon">↻</span>
                            <span class="btn-label">Next Quote</span>
                        </button>

                        <button class="action-btn" id="share-btn" onclick="openShareModal()" title="Generate Social Image" disabled>
                            <span class="icon">🖼️</span>
                            <span class="btn-label">Share Card</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
